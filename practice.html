<!DOCTYPE html>
<html>
    <head>
        <title>WEb Page</title>
        <style>
            #headi{
                
                text-align: center;
            }
            #box1{
                
                
                display: flex;
                justify-content: center;
            }
            #inptbox{
                text-align: center;
                width:350px;
                border: 1px solid black;
                border-radius: 10px;
                padding: 20px;
            }
            #addbtn{
                padding: 7px;
            }
            #container{
                display:flex;
                justify-content: center;
                flex-wrap: wrap;
                gap:40px;

            }
            .card{
                border: 1px solid black;
                border-radius: 10px;
                width: 350px;
                padding: 10px;
                text-align: center;
                
            }
        </style>


    </head>
    <body>
        <h1 id="headi">STUDENT MANAGEMENT SYSTEM</h1>
        <div id="box1">
            <div id="inptbox">
                <a>Name:       </a>
            <input id="name" placeholder="ENTER NAME">
            <br><br>
            <a>BRANCH:     </a>
            <input id="branch" placeholder="ENTER BRANCH">
             <br><br>

            <a>PERCENTAGE: </a>
            <input id="prec" placeholder="ENTER PERCENTAGE">
            <br>
            <br>
            <button id="addbtn">ADD STUDENT</button>
            <button onclick="update()">Update Student</button>
            <br>
            <br>
            <input id="search" placeholder="Search By Student Name">
            <<br>
            <button onclick="search()">Search</button>



            </div>
            
            

            

            

        </div>
        <br><br>
        <br><br>
        <br><br>
        
        <br>

        <div id="container">


            </div>
            <br>
           

     <script>
         
         call_all_record();
         let editingId = null;
       
        
       
        let btn1=document.querySelector("#addbtn");
        
        btn1.addEventListener("click",
            async function(){
                try{

                     let name=document.querySelector("#name").value;
                 let branch=document.querySelector("#branch").value;
                 let perc=Number(document.querySelector("#prec").value);
                 const response=await fetch("http://localhost:3000/students",{
                    method:"POST",
                    headers:{ "content-Type":"application/json"
                },
                body:JSON.stringify(
                    {
    "name": name,
    "branch": branch,
    "perc": perc
}
                )

                })
                const data= await response.text();
                if(response.ok){
                    console.log(data);
                    call_all_record();
                    document.querySelector("#name").value="";
                    document.querySelector("#branch").value="";
                    document.querySelector("#prec").value=""
                }
                else{
                    alert("Error: "+data);

                }
                
                
                
                

               
                
               
                }
                catch(error){
                    alert("Error: "+error);
                }
                  

              
                }
                
               
                


               
            

        )
        function display(data){

           
                   filter=[...data];
                  let container=document.querySelector("#container");
            container.innerHTML="";
            for(let i=0;i<filter.length;i++){
                let box=document.createElement("div");
                let p1=document.createElement("p");
                let p2=document.createElement("p");
                let p3=document.createElement("p");
                let delte=document.createElement("button");
                let edit=document.createElement("button");
                edit.textContent="EDIT";
                edit.dataset.index = i;
               

                delte.textContent="DELETE";
                delte.dataset.index=i;
                p1.textContent="NAME:    "+filter[i].name;
                p2.textContent="BRANCH:  "+filter[i].branch;
                p3.textContent="PERCENTAILE: "+filter[i].perc;
                box.appendChild(p1);
                box.appendChild(p2);
                box.appendChild(p3);
                box.appendChild(delte);
              
                box.appendChild(edit);

                box.classList.add("card");
                let main=document.querySelector("#container");
                main.appendChild(box);

                delte.addEventListener("click",
                    async function(event){
                        try{

                            let record=event.target.dataset.index;
                        let id=filter[record].id;
                        const response=await fetch("http://localhost:3000/students/"+id,{
                            method:"DELETE",
                            
                        })
                        const data=await response.text();
                       
                        if(response.ok){
                            call_all_record();
                             console.log(data);
                        }
                        else{
                            alert("Error: "+data);
                        }


                        }
                        catch(error){
                            alert("Error:"+error);

                        }
                        
                       


            


                   
                    }
                )
                edit.addEventListener("click",
                    function(event){
                         index=event.target.dataset.index;
                         
                        let  student =filter[index];
                        document.querySelector("#name").value=student.name;
                        document.querySelector("#branch").value=student.branch;
                        document.querySelector("#prec").value=student.perc;
                        editingId =student.id;
                      




                       
                        

                    }
                )
            
            

            }
          
           
           

            
           
          
        }
                    async function update(){
                        try{

                            namea=document.querySelector("#name").value;
                        branch=document.querySelector("#branch").value;
                        perc=Number(document.querySelector("#prec").value);
                         
                            const response=await fetch("http://localhost:3000/students/"+editingId,{
                                method:"PUT",
                                headers:{ "content-Type":"application/json"},
                                body:JSON.stringify({
                                    name:namea,
                                    branch:branch,
                                    perc:perc

                                })
                               
                            })
                               const data=await response.text();
                             if(response.ok){
                                  console.log(data);
                               call_all_record();
                               editingId = null;
                               document.querySelector("#name").value="";
                               document.querySelector("#branch").value="";
                               document.querySelector("#prec").value="";
                             }
                             else{
                                alert("Error: "+data);
                             }
                        }
                        catch(error){
                            alert("Error: "+error);
                        }
                            

                        }

        async function search(){
            try{
                let val=document.querySelector("#search").value;
            const response=await fetch("http://localhost:3000/students?name="+val)
            const data=await response.json();
            if(response.ok){
               if(data.length>0){
                 display(data);
               }
               else{
                alert("students not found");
               }

            }
            else{
                
            }
            
            }
            catch(error){
                alert("Error:"+error);
            }

            
           

            

            
        }
        async function call_all_record(){
             try{
                const response=await fetch("http://localhost:3000/students");
             const data=await response.json();
             
                display(data);
             }
             catch(error){
                alert("Error: "+error);
             }

            
             
            
        }
     


 


        
     </script>
    </body>
</html>
